name: Check changed

# The only workflow in this repository: Twenty's own workflows are left out on purpose.
# Runs once per push to a feature branch and checks only what changed since main.
on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

concurrency:
  group: check-changed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/yarn-install

      - name: Write .env files
        run: |
          npx nx reset:env twenty-server
          cp packages/twenty-front/.env.example packages/twenty-front/.env

      - name: Check what changed since main
        run: scripts/check-changed.sh --base origin/main
